[project]
name = "ai-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.140.13",
    "package-name>=0.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "ai-chatbot",
    "black>=26.5.1",
    "isort>=8.0.1",
    "pytest>=9.1.1",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
ai-chatbot = { workspace = true }
